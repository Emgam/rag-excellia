services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: excellia-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__STORAGE__MEMORY_LIMIT=4.0
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'health' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - excellia-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: excellia-api
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - QDRANT_COLLECTION=excellia_docs
      - QDRANT_ON_DISK=true
      - QDRANT_TIMEOUT=60

      # Ollama – Using local Windows Ollama for maximum CPU speed
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct-q4_k_m
      - OLLAMA_FALLBACK_MODEL=qwen2.5:1.5b-instruct-q4_k_m
      - OLLAMA_TIMEOUT_SECONDS=600
      - OLLAMA_TEMPERATURE=0.0
      - OLLAMA_MAX_TOKENS=300

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # CPU threading
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - OMP_PROC_BIND=CLOSE

      - PYTHONUNBUFFERED=1

      # Embeddings
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - EMBEDDING_DEVICE=cpu
      - EMBEDDING_BATCH_SIZE=32

      # Reranker
      - RERANKER_ENABLED=true
      - RERANKER_MODEL=Xenova/ms-marco-MiniLM-L-6-v2
      - RERANK_TOP_K=4

      # Chunking
      - CHUNK_SIZE_TOKENS=250
      - CHUNK_OVERLAP_TOKENS=0

      # Cache
      - ENABLE_QUERY_CACHE=true
      - QUERY_CACHE_TTL=3600

      # API
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - STREAMING_ENABLED=false
      - LOG_LEVEL=INFO
      - CONFIDENCE_THRESHOLD=0.01

      # Smart routing – models mapped to your local files
      - SIMPLE_MODEL=qwen2.5:1.5b-instruct-q4_k_m
      - SIMPLE_TOP_K=5
      - SIMPLE_MAX_TOKENS=80
      - SIMPLE_RERANKER=false

      - MEDIUM_MODEL=qwen2.5:1.5b-instruct-q4_k_m
      - MEDIUM_TOP_K=4
      - MEDIUM_MAX_TOKENS=120
      - MEDIUM_RERANKER=true

      - COMPLEX_MODEL=qwen2.5:3b-instruct-q4_k_m
      - COMPLEX_TOP_K=3
      - COMPLEX_MAX_TOKENS=120
      - COMPLEX_RERANKER=true

    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - excellia-network
    volumes:
      - ./documents:/app/documents
      - ./data:/app/data
      # - ./cache:/root/.cache 
      #- ./cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: excellia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --save 900 1
      --save 300 10
      --save 60 10000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - excellia-network
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  excellia-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local